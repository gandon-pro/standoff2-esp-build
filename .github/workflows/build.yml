name: Build ESP runtime
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Compile arm64 iOS library
        run: bash build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: S2ESP-arm64-unsigned
          path: out/S2ESP.dylib
          if-no-files-found: error
